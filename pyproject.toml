[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ninav"
version = "0.1.0"
description = "A clean, tested reference implementation of neural inertial navigation (RoNIN / TLIO style)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Anton" },
]
keywords = ["inertial-navigation", "imu", "ronin", "tlio", "deep-learning", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "torch",
    "h5py",
    "matplotlib",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
ninav = "ninav.cli:main"

[tool.setuptools.packages.find]
include = ["ninav*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end / training tests (deselect with '-m \"not slow\"')",
]
